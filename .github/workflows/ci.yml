name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, tests and coverage gate
        run: ./mvnw -B verify

      - name: Mutation testing
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/site/jacoco
            target/pit-reports
            target/surefire-reports

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag mini-authorizer:${{ github.sha }} .
