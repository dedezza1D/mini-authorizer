spring:
  application:
    name: mini-authorizer
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/miniautorizador?sslMode=REQUIRED&tlsVersions=TLSv1.2&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Hibernate 6.6's MySQLDialect targets MySQL 8+; the provided MySQL 5.7 needs the legacy dialect.
        dialect: org.hibernate.community.dialect.MySQLLegacyDialect
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # Local defaults match the credentials of the API contract. The prod profile has none.
    bootstrap-user:
      username: ${API_USERNAME:username}
      password: ${API_PASSWORD:password}
    lockout:
      max-attempts: 5
      duration: 15m
    # Base64 secret of at least 32 bytes mixed into every PIN hash. This value is for local use
    # only and is public; real environments set PIN_PEPPER from a secret manager.
    pin-pepper: ${PIN_PEPPER:XscXnNomhBPzKdr32g5yzev4iYv7SkDW2ud36CCzyBE=}
    # OAuth2 client credentials. Without signing-key/verification-key (PEM resources such as
    # file:keys/token-signing.pem) an ephemeral key is generated, valid on this instance only.
    tokens:
      issuer: mini-authorizer
      audience: mini-authorizer
      time-to-live: 5m
    # Per client and per instance; the global limit per client is the API gateway's job.
    rate-limit:
      requests-per-second: 100
      burst: 200

  cards:
    # Wrong PINs within the window that block the card, for the same window.
    pin-lockout:
      max-attempts: 3
      window: 30m

  idempotency:
    retention: P7D
    cleanup-interval: PT1H
